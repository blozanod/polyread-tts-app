name: Web

# Typecheck, test and build the site on every push. Nothing here needs the
# model files: the tests cover the pipeline, not the checkpoint.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Electron sources are not in the default install's tsconfig, so they
      # get their own pass — after adding the toolchain they need.
      - run: npm run desktop:setup
      - run: npm run desktop:check
      - run: npm run electron:build
