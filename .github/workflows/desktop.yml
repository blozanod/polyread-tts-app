name: Desktop builds

# Builds the macOS, Windows and Linux apps. The point of it is the macOS one:
# a .dmg cannot be produced from Linux, so pushing a v* tag is how you get one
# without owning a Mac.
#
# Push a tag to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it by hand from the Actions tab to get the installers as artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bundle_models:
        description: "Bundle the model files into the installers (adds ~170 MB each)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Electron and electron-builder are not in devDependencies; see the note
      # in web/README.md about why the default install stays small.
      - run: npm run desktop:setup

      - run: npm test

      # `npm run assets` writes into public/models, which Vite copies into
      # dist/ and electron-builder then packages — so this one step is the
      # difference between an offline installer and one that needs a download.
      - name: Fetch the model
        if: github.event_name == 'push' || inputs.bundle_models
        run: npm run assets -- --dtype fp16

      - name: Build the duration model
        if: github.event_name == 'push' || inputs.bundle_models
        run: |
          python3 -m pip install --quiet onnx onnxruntime numpy
          python3 scripts/make-duration-model.py public/models/kokoro.onnx
        continue-on-error: true

      - run: npm run ${{ matrix.target }}
        env:
          # electron-builder would otherwise try to publish on a tag push, and
          # the release step below does that with the right permissions.
          GH_TOKEN: ""

      - uses: actions/upload-artifact@v4
        with:
          name: polyread-${{ matrix.os }}
          path: |
            web/release/*.dmg
            web/release/*.exe
            web/release/*.AppImage
            web/release/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/release/*.dmg
            web/release/*.exe
            web/release/*.AppImage
            web/release/*.deb
          fail_on_unmatched_files: false
          body: |
            Unsigned personal builds. macOS: right-click → Open the first time.
            Windows: "More info" → "Run anyway".
