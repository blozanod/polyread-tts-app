name: Build and test

# Compiles the PolyRead Swift package and runs its unit tests on a
# GitHub-hosted macOS runner. This is the "does it compile / do the
# existing tests pass" loop from the README's `swift test` note — it
# runs on GitHub's infrastructure, so no local Mac is required.
#
# It does NOT build the App/ Xcode target (that needs the Core ML model
# files described in Models/README.md, plus code signing) and it cannot
# exercise anything that needs a real device (Neural Engine, the §0
# benchmark). It only proves the Sources/ and Tests/ package builds and
# its logic-level tests pass on an iOS Simulator.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Show available schemes and SDKs
        run: |
          xcodebuild -list
          xcodebuild -showsdks

      - name: Build and test PolyRead package
        run: |
          set -o pipefail
          # .swiftpm/xcode/xcshareddata/xcschemes/PolyReadAllTests.xcscheme is
          # a checked-in scheme with a Test action covering all four test
          # targets — xcodebuild's auto-generated schemes don't have one.
          #
          # `xcodebuild -showdestinations` against that scheme (tried
          # previously) fails outright: its buildables are XCTest bundles,
          # which can never satisfy a Run/Launch action, so xcodebuild
          # refuses to resolve anything for it regardless of the scheme's
          # buildForRunning flag. So this pins a destination directly instead
          # of trying to auto-discover one: iPhone 16 on iOS 18.5, which the
          # runner's active Xcode 16.4 (confirmed via `xcodebuild -version`
          # earlier in this job) ships paired with, and which the simulator
          # list from an earlier run confirmed exists on this runner image.
          xcodebuild test \
            -scheme PolyReadAllTests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
