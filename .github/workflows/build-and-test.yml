name: Build and test

# Compiles the PolyRead Swift package and runs its unit tests on a
# GitHub-hosted macOS runner. This is the "does it compile / do the
# existing tests pass" loop from the README's `swift test` note — it
# runs on GitHub's infrastructure, so no local Mac is required.
#
# It does NOT build the App/ Xcode target (that needs the Core ML model
# files described in Models/README.md, plus code signing) and it cannot
# exercise anything that needs a real device (Neural Engine, the §0
# benchmark). It only proves the Sources/ and Tests/ package builds and
# its logic-level tests pass on an iOS Simulator.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Show available schemes and SDKs
        run: |
          xcodebuild -list
          xcodebuild -showsdks

      - name: Pick an available iOS 18.5 simulator UDID
        id: device
        run: |
          set -o pipefail
          # Matching by name/OS string ("name=iPhone 16,OS=18.5") kept failing
          # even when both the name and the OS individually check out — the
          # runner has multiple Xcode installs and simulator registries, and
          # xcodebuild's string matching against them isn't reliable here.
          # Ask simctl directly (the actual simulator registry) for a device
          # it considers available under the iOS 18.5 runtime, and target it
          # by UDID — unambiguous, no string matching involved.
          udid=$(xcrun simctl list devices available --json | python3 -c '
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data["devices"].items():
    if "iOS-18-5" not in runtime:
        continue
    for d in devices:
        if d.get("isAvailable", True):
            print(d["udid"])
            sys.exit(0)
')
          if [ -z "$udid" ]; then
            echo "::error::No available iOS 18.5 simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator udid=$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test PolyRead package
        run: |
          set -o pipefail
          # .swiftpm/xcode/xcshareddata/xcschemes/PolyReadAllTests.xcscheme is
          # a checked-in scheme with a Test action covering all four test
          # targets — xcodebuild's auto-generated schemes don't have one.
          xcodebuild test \
            -scheme PolyReadAllTests \
            -destination "id=${{ steps.device.outputs.udid }}"
