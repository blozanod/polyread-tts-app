name: Build and test

# Compiles the PolyRead Swift package and runs its unit tests on a
# GitHub-hosted macOS runner. This is the "does it compile / do the
# existing tests pass" loop from the README's `swift test` note — it
# runs on GitHub's infrastructure, so no local Mac is required.
#
# It does NOT build the App/ Xcode target (that needs the Core ML model
# files described in Models/README.md, plus code signing) and it cannot
# exercise anything that needs a real device (Neural Engine, the §0
# benchmark). It only proves the Sources/ and Tests/ package builds and
# its logic-level tests pass on an iOS Simulator.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Show available schemes
        run: xcodebuild -list

      - name: Pick a valid iOS Simulator destination
        id: destination
        run: |
          set -o pipefail
          # Runners ship several Xcode versions side by side; `simctl list`
          # shows every simulator on the machine regardless of which Xcode
          # created it, but the *active* xcodebuild can only target runtimes
          # it actually supports — hardcoding a name/OS guess (twice, now)
          # has failed. Ask xcodebuild itself what this scheme can target.
          xcodebuild -showdestinations -scheme PolyReadAllTests 2>&1 | tee /tmp/destinations.txt
          id=$(grep -o 'platform:iOS Simulator, id:[0-9A-F-]*' /tmp/destinations.txt | head -1 | sed 's/.*id://')
          if [ -z "$id" ]; then
            echo "::error::No iOS Simulator destination found for scheme PolyReadAllTests"
            exit 1
          fi
          echo "Using destination id=$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test PolyRead package
        run: |
          set -o pipefail
          # .swiftpm/xcode/xcshareddata/xcschemes/PolyReadAllTests.xcscheme is
          # a checked-in scheme with a Test action covering all four test
          # targets — xcodebuild's auto-generated schemes don't have one.
          xcodebuild test \
            -scheme PolyReadAllTests \
            -destination "id=${{ steps.destination.outputs.id }}"
